<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Drug')}"></head>
<body>

<div th:replace="~{fragments/layout :: deco}"></div>
<header th:replace="~{fragments/layout :: topbar('drugs')}"></header>

<main class="page narrow">

    <div class="win">
        <div class="bar">
            <span>Add / Edit Drug</span>
            <div th:replace="~{fragments/layout :: dots}"></div>
        </div>

        <div class="win-body">
            <h1 class="h-pink center">Add / Edit Drug</h1>

            <form th:action="@{/drugs}" th:object="${drug}" method="post">

                <!-- Hidden fields (important for edit) -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{rxcui}" />

                <div class="field">
                    <label for="name">Drug Name</label>
                    <input type="text" th:field="*{name}" class="input" placeholder="Enter drug name" required>
                </div>

                <div class="field">
                    <label for="manufacturer">Manufacturer</label>
                    <input type="text" th:field="*{manufacturer}" class="input" placeholder="Enter manufacturer" required>
                </div>

                <div class="field">
                    <label for="usage">Usage</label>
                    <textarea th:field="*{usage}" class="textarea" placeholder="What is it used for?" required></textarea>
                </div>

                <div class="field">
                    <label for="sideEffects">Side Effects</label>
                    <textarea th:field="*{sideEffects}" class="textarea" placeholder="Possible side effects" required></textarea>
                </div>

                <div class="head-row" style="margin:0">
                    <a th:href="@{/drugs}" class="btn lav">← Back</a>
                    <button type="submit" class="btn">Save Drug</button>
                </div>

            </form>
        </div>
    </div>

</main>

</body>
</html>
