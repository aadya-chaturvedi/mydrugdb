<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('MyDrugDB')}"></head>
<body>

<div th:replace="~{fragments/layout :: deco}"></div>
<header th:replace="~{fragments/layout :: topbar('home')}"></header>

<main class="page narrow" style="padding-top:40px">

    <div class="win">
        <div class="bar">
            <span>MyDrugDB</span>
            <div th:replace="~{fragments/layout :: dots}"></div>
        </div>

        <div class="win-body center" style="padding:34px 40px 32px">
            <h1 class="title-big huge">MyDrugDB</h1>

            <p class="lead">
                Search for a drug or browse the full database
            </p>

            <!-- Search Form -->
            <form th:action="@{/drugs/external-search}" method="get" class="search-row mt" style="margin-top:26px">
                <input type="text"
                       name="name"
                       class="input"
                       placeholder="Search for a medication..."
                       required>

                <button class="btn" type="submit">
                    Search
                </button>
            </form>

            <!-- View All -->
            <a th:href="@{/drugs}" class="btn lav wide mt">
                View All Drugs
            </a>
        </div>
    </div>

</main>

</body>
</html>
