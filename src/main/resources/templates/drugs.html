<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Drugs')}"></head>
<body>

<div th:replace="~{fragments/layout :: deco}"></div>
<header th:replace="~{fragments/layout :: topbar('drugs')}"></header>

<main class="page">

    <div class="win">
        <div class="bar">
            <span>Drug Database</span>
            <div th:replace="~{fragments/layout :: dots}"></div>
        </div>

        <div class="win-body">

            <div class="head-row">
                <h1 class="h-pink" style="margin:0">Drug Database</h1>
                <a th:href="@{/drugs/new}" class="btn">+ Add New Drug</a>
            </div>

            <div th:if="${param.saved}" class="alert ok">
                Medication successfully saved to your database.
            </div>

            <div th:if="${param.duplicate}" class="alert warn">
                This medication is already saved in your database.
            </div>

            <!-- Search -->
            <form th:action="@{/drugs}" method="get" class="search-row" style="max-width:640px;margin-bottom:16px">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="input" placeholder="Search drug name...">
                <button type="submit" class="btn blue">Search</button>
                <a th:href="@{/drugs}" class="btn lav">Clear</a>
            </form>

            <!-- No data message -->
            <div th:if="${#lists.isEmpty(drugs)}" class="alert warn">
                No drugs found.
            </div>

            <!-- Table -->
            <div class="table-wrap" th:if="${not #lists.isEmpty(drugs)}">
                <table class="drug-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Manufacturer</th>
                        <th>Details</th>
                        <th>Manage</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="drug : ${drugs}">
                        <td><span class="badge" th:text="${drug.id}">1</span></td>
                        <td>
                            <a class="drug-name"
                               th:href="@{/drugs/{id}(id=${drug.id})}"
                               th:text="${drug.name}">Name</a>
                        </td>
                        <td class="maker" th:text="${drug.manufacturer}"></td>

                        <td>
                            <div class="btn-row">
                                <a th:href="@{/drugs/{id}(id=${drug.id})} + '#usage'"
                                   class="btn sm blue">
                                    Usage
                                </a>

                                <a th:href="@{/drugs/{id}(id=${drug.id})} + '#side-effects'"
                                   class="btn sm lav">
                                    Side Effects
                                </a>
                            </div>
                        </td>
                        <td>
                            <div class="btn-row">
                                <a th:href="@{/drugs/edit/{id}(id=${drug.id})}" class="btn sm">Edit</a>

                                <!-- Delete is a POST form so a link click or prefetch can't delete by accident -->
                                <form th:action="@{/drugs/delete/{id}(id=${drug.id})}" method="post" class="inline-form"
                                      onsubmit="return confirm('Are you sure you want to delete this drug?')">
                                    <button type="submit" class="btn sm magenta">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt">
                <a th:href="@{/}" class="btn sm lav">← Back to Home</a>
            </div>

        </div>
    </div>

</main>

</body>
</html>
