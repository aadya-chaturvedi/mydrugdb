<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Drug Details | MyDrugDB')}"></head>
<body>

<div th:replace="~{fragments/layout :: deco}"></div>
<header th:replace="~{fragments/layout :: topbar('drugs')}"></header>

<main class="page">

    <div class="win">
        <div class="bar">
            <span>Drug Details</span>
            <div th:replace="~{fragments/layout :: dots}"></div>
        </div>

        <div class="win-body">
            <h1 class="title-big" th:text="${drug.name}">Drug Name</h1>

            <div class="info-row">
                <span>
                    <span class="label">Manufacturer:</span>
                    <span th:text="${drug.manufacturer}"></span>
                </span>

                <span th:if="${drug.rxcui != null}">
                    <span class="label">RxNorm ID:</span>
                    <span class="badge" th:text="${drug.rxcui}"></span>
                </span>
            </div>
        </div>
    </div>

    <div class="two-col">

        <!-- Usage -->
        <div id="usage" class="win">
            <div class="bar">
                <span>Indications &amp; Usage</span>
                <div th:replace="~{fragments/layout :: dots}"></div>
            </div>
            <div class="win-body">
                <h2 class="h-pink sm">Indications &amp; Usage</h2>

                <p th:if="${drug.usage != null}"
                   th:text="${drug.usage}"
                   class="long-text">
                </p>

                <p th:if="${drug.usage == null}" class="muted">
                    Usage information is not available.
                </p>
            </div>
        </div>

        <!-- Side Effects -->
        <div id="side-effects" class="win blue">
            <div class="bar">
                <span>Adverse Reactions</span>
                <div th:replace="~{fragments/layout :: dots}"></div>
            </div>
            <div class="win-body">
                <h2 class="h-blue">Adverse Reactions</h2>

                <p th:if="${drug.sideEffects != null}"
                   th:text="${drug.sideEffects}"
                   class="long-text">
                </p>

                <p th:if="${drug.sideEffects == null}" class="muted">
                    Adverse reaction information is not available.
                </p>
            </div>
        </div>

    </div>

    <a th:href="@{/drugs}" class="btn lav">
        ← Back to Drug Database
    </a>

</main>

</body>
</html>
