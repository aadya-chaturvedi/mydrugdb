<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Drug Details | MyDrugDB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5 mb-5" style="max-width: 900px;">

    <div class="mb-4">
        <h1>💊 Drug Details</h1>
    </div>

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h2 class="card-title mb-3"
                th:text="${drug.name}">
                Drug Name
            </h2>

            <p>
                <strong>Manufacturer:</strong>
                <span th:text="${drug.manufacturer}"></span>
            </p>

            <p th:if="${drug.rxcui != null}">
                <strong>RxNorm ID:</strong>
                <span th:text="${drug.rxcui}"></span>
            </p>

        </div>

    </div>

    <!-- Usage -->
    <div id="usage" class="card shadow-sm mb-4">

        <div class="card-body">

            <h3 class="h5">
                Indications &amp; Usage
            </h3>

            <p th:if="${drug.usage != null}"
               th:text="${drug.usage}"
               style="white-space: pre-line;">
            </p>

            <p th:if="${drug.usage == null}"
               class="text-muted">
                Usage information is not available.
            </p>

        </div>

    </div>

    <!-- Side Effects -->
    <div id="side-effects" class="card shadow-sm mb-4">

        <div class="card-body">

            <h3 class="h5">
                Adverse Reactions
            </h3>

            <p th:if="${drug.sideEffects != null}"
               th:text="${drug.sideEffects}"
               style="white-space: pre-line;">
            </p>

            <p th:if="${drug.sideEffects == null}"
               class="text-muted">
                Adverse reaction information is not available.
            </p>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/drugs}"
           class="btn btn-outline-secondary">
            ← Back to Drug Database
        </a>

    </div>

</div>

</body>
</html>
